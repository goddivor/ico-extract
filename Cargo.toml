[package]
name = "ico-extract"
version = "0.1.0"
edition = "2021"
description = "Extract icons (.ico) from Windows PE files (.dll/.exe/.mun) — pure Rust, compiles to WASM"
license = "MIT"
repository = "https://github.com/goddivor/ico-extract"
authors = ["Divor"]
keywords = ["ico", "icon", "pe", "dll", "wasm"]
categories = ["parser-implementations", "wasm"]

# Extra fields wasm-pack copies into the generated pkg/package.json.
[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[package.metadata.wasm-pack]
keywords = ["ico", "icon", "extract", "pe", "dll", "exe", "mun", "windows", "wasm", "rust"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[features]
# Enable the WASM binding (used by wasm-pack). Native builds/tests stay dependency-free.
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
